# Render Blueprint - FORM Wireless Earbuds
#
# Static site. Plain HTML, CSS and vanilla JS with embedded media.
# Render serves the directory directly.
#
# Deploy: Render Dashboard > New > Blueprint > select danniedaniels209-bot/form-site

services:
  - type: web
    name: form-site
    runtime: static
    buildCommand: "echo 'no build step - static assets served directly'"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false

    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache

      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
